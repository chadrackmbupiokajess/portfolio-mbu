{# Formulaire de modification d'un commentaire (affiché si la page est ouverte sans JavaScript). #}
<form method="post" action="{% url 'edit_comment' comment.id %}" class="form-stack" enctype="multipart/form-data" style="max-width:640px">
    {% csrf_token %}
    <div class="field">
        <label for="{{ form.text.id_for_label }}">Modifier le commentaire</label>
        {{ form.text }}
        {% if form.text.errors %}<div class="error">{{ form.text.errors|join:" " }}</div>{% endif %}
    </div>
    {% if comment.image %}
        <div class="field">
            <span class="label">Image actuelle</span>
            <img src="{{ comment.image.url }}" alt="" style="max-width:200px;border-radius:6px">
        </div>
    {% endif %}
    <div class="d-flex gap-2 justify-content-end">
        <a href="{% url 'project_detail' comment.project.id %}#comment-{{ comment.id }}" class="btn-site btn-outline-site btn-sm-site">Annuler</a>
        <button type="submit" class="btn-site btn-primary-site btn-sm-site">Enregistrer</button>
    </div>
</form>
